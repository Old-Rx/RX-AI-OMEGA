name: Build Windows offline bundle

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheelhouse:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - name: Build project and dependency wheels
        shell: pwsh
        run: |
          python -m pip install --upgrade pip build
          python -m pip wheel --wheel-dir wheelhouse ".[dev]"
      - name: Package and checksum the wheelhouse
        shell: pwsh
        run: |
          $archive = "rx-ai-omega-windows-py314-wheelhouse.zip"
          Compress-Archive -Path "wheelhouse\*" -DestinationPath $archive -CompressionLevel Optimal
          $hash = (Get-FileHash -Algorithm SHA256 -Path $archive).Hash.ToLowerInvariant()
          "$hash  $archive" | Set-Content -Encoding utf8 "$archive.sha256"
      - name: Publish private release asset
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "windows-offline-py314-v1"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag rx-ai-omega-windows-py314-wheelhouse.zip `
              rx-ai-omega-windows-py314-wheelhouse.zip.sha256 --clobber
          } else {
            gh release create $tag `
              --target $env:GITHUB_SHA `
              --title "Windows Python 3.14 offline bundle" `
              --notes "Official offline wheelhouse generated by GitHub Actions for restricted-network Windows development." `
              rx-ai-omega-windows-py314-wheelhouse.zip `
              rx-ai-omega-windows-py314-wheelhouse.zip.sha256
          }
