name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - name: Run mypy
        shell: bash
        run: |
          set -o pipefail
          set +e
          mypy src 2>&1 | tee mypy.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            awk -F: '/: error: / {
              message=$0
              sub(/^[^:]+:[^:]+: /, "", message)
              printf "::error file=%s,line=%s::%s\n", $1, $2, message
            }' mypy.log
            {
              echo "### mypy diagnostics"
              echo '```text'
              cat mypy.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"
      - run: pytest --cov --cov-report=term-missing --cov-fail-under=80
        env:
          RX_ENVIRONMENT: test
      - name: Verify migration on a blank database
        run: alembic upgrade head
        env:
          RX_ENVIRONMENT: test
          RX_DATABASE_URL: sqlite:///./migration-check.sqlite3
          RX_AUTH_SECRET: ci-only-secret-that-is-never-used-outside-ci

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose model
        run: docker compose config --quiet
        env:
          POSTGRES_PASSWORD: compose-validation-only
          RX_AUTH_SECRET: compose-validation-secret-at-least-32-characters
          RX_BOOTSTRAP_ADMIN_PASSWORD: compose-validation-admin
      - run: docker build -t rx-ai-omega-api:test .
      - run: docker build -t rx-ai-omega-frontend:test frontend
